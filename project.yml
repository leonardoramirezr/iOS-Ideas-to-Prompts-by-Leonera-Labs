name: IdeasToPrompts
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    # Identificadores y versión. El workflow los sobrescribe pasándolos a xcodebuild.
    APP_BUNDLE_ID: com.leonardoramirezr.Ideastopromptsbyleoneralabs
    APP_BUILD_TAG: dev
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  IdeasToPrompts:
    type: application
    platform: iOS
    sources:
      - path: IdeasToPrompts
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: IdeasToPrompts
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: IdeasToPrompts/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconOnda AppIconBurbuja AppIconMicrofono AppIconCristal AppIconMensaje AppIconEstudio AppIconTerminal AppIconOrbe AppIconLibreta AppIconCubo AppIconDestello
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
schemes:
  IdeasToPrompts:
    build:
      targets:
        IdeasToPrompts: all
    run:
      config: Debug
    archive:
      config: Release
